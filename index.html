<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知构测试作品</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, "PingFang SC", sans-serif;
      background: #0f766e;
      color: #ecfdf5;
    }
    .card {
      width: min(480px, 92vw);
      padding: 40px 36px;
      border-radius: 20px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.28);
      text-align: center;
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { line-height: 1.7; opacity: .9; }
    .tag {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #99f6e4;
      color: #115e59;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>知构测试作品</h1>
    <p>这是推到 GitHub 后，由开发舱克隆并启动的静态页面。若作品展廊能看到这块青绿卡片，说明克隆、部署、预览已经打通。</p>
    <span class="tag">CarlYuHQ / testfronted</span>
  </div>
</body>
</html>
